[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-dungeon-generator"
version = "1.4.2"
description = "AI-driven pixel dungeon and level generator for Windows desktop."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pixel-dungeon-generator contributors" }]
keywords = ["procedural-generation", "roguelike", "pixel-art", "wfc", "diffusion", "level-generator"]

dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "onnxruntime>=1.17",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.4", "mypy>=1.10"]

[project.scripts]
pdn = "pixel_dungeon_generator.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pixel_dungeon_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pixel_dungeon_generator --cov-report=term-missing"